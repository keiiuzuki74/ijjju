<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:#0a0a0a;
    border:2px solid #39ff14;
    border-radius:20px;
    padding:40px;
    box-shadow:0 0 20px #39ff14;
}

h1{
    color:#39ff14;
    text-align:center;
    margin-bottom:30px;
    text-shadow:0 0 15px #39ff14;
}

input{
    width:100%;
    padding:15px;
    margin:12px 0;
    background:black;
    color:#39ff14;
    border:2px solid #39ff14;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

input::placeholder{
    color:#39ff14;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:black;
    color:#39ff14;
    border:2px solid #39ff14;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#39ff14;
    color:black;
}

#status{
    color:#39ff14;
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">
    <h1>ACCESS PANEL</h1>

    <form id="userForm">
        <input type="text" id="name" placeholder="NAME" required>
        <input type="email" id="email" placeholder="EMAIL" required>
        <input type="text" id="code" placeholder="CODE" required>

        <button type="submit">SUBMIT</button>
    </form>

    <p id="status"></p>
</div>

<script>
document.getElementById("userForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        code: document.getElementById("code").value
    };

    const response = await fetch("https://YOUR_RAILWAY_URL.up.railway.app/submit", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    if(response.ok){
        document.getElementById("status").innerText = "Saved Successfully!";
        this.reset();
    } else {
        document.getElementById("status").innerText = "Failed to save.";
    }
});
</script>

</body>
</html>
